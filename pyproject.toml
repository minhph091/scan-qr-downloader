[project]
name = "scan-qr-downloader"
version = "1.0.0"
description = "Local web application to batch-scan QR codes from book page images and download linked files to a target directory."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "httpx>=0.27.2",
    "aiofiles>=24.1.0",
    "tenacity>=9.0.0",
    "pillow>=11.0.0",
    "opencv-python-headless>=4.10.0.84",
    "zxing-cpp>=2.2.0",
    "numpy>=1.26.0",
    "qrcode[pil]>=8.0",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.18.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
